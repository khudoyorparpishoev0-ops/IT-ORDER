# HONA ORDER — платформа заявок на расходы.
# Персистентные данные лежат в папках хоста, именованные тома не используем.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hona_core}
      POSTGRES_USER: ${POSTGRES_USER:-hona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      # Кластер во вложенной папке: initdb падает в непустом каталоге.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DB_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hona} -d ${POSTGRES_DB:-hona_core}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем: база доступна только внутри сети compose.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hona_core}
      POSTGRES_USER: ${POSTGRES_USER:-hona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      APP_ENV: ${APP_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dushanbe}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY не задан в .env — openssl rand -hex 32}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-ithona.tj}
      REQUIRE_2FA_ROLES: ${REQUIRE_2FA_ROLES:-admin,finance}
      TOTP_ISSUER: ${TOTP_ISSUER:-IT-HONA ORDER}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-8}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      SMTP_HOST: ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-IT-HONA ORDER}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      STALE_REQUEST_DAYS: ${STALE_REQUEST_DAYS:-3}
      REMINDER_HOUR: ${REMINDER_HOUR:-9}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5}
      ASSISTANT_PROMPT_FILE: ${ASSISTANT_PROMPT_FILE:-}
      ASSISTANT_TIMEOUT_SECONDS: ${ASSISTANT_TIMEOUT_SECONDS:-90}
      AI_INTERACTIONS_RETENTION_DAYS: ${AI_INTERACTIONS_RETENTION_DAYS:-180}
      ANALYTICS_PROMPT_FILE: ${ANALYTICS_PROMPT_FILE:-}
      INTELLIGENCE_SCAN_MINUTES: ${INTELLIGENCE_SCAN_MINUTES:-20}
      CRITICAL_ALERT_REPEAT_HOURS: ${CRITICAL_ALERT_REPEAT_HOURS:-12}
      STALE_HOURS: ${STALE_HOURS:-24}
      SLA_PENDING_HOURS: ${SLA_PENDING_HOURS:-8}
      SLA_SOURCING_HOURS: ${SLA_SOURCING_HOURS:-24}
      SLA_PRICED_HOURS: ${SLA_PRICED_HOURS:-8}
      SLA_APPROVED_HOURS: ${SLA_APPROVED_HOURS:-24}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Администратор}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Порт наружу не публикуем: API идёт через nginx вместе с панелью.

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # Только на локальный интерфейс: снаружи панель отдаёт Caddy по HTTPS
      # (docker-compose.prod.yml). Так порт 8080 не смотрит в интернет,
      # даже если в фаерволе его случайно откроют.
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      - api
