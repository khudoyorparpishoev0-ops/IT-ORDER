# HONA CORE — платформа заявок на расходы.
# Персистентные данные лежат в папках хоста, именованные тома не используем.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hona_core}
      POSTGRES_USER: ${POSTGRES_USER:-hona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      # Кластер во вложенной папке: initdb падает в непустом каталоге.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DB_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hona} -d ${POSTGRES_DB:-hona_core}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем: база доступна только внутри сети compose.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hona_core}
      POSTGRES_USER: ${POSTGRES_USER:-hona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      APP_ENV: ${APP_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dushanbe}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_APPROVE_THRESHOLD: ${AUTO_APPROVE_THRESHOLD:-500.00}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY не задан в .env — openssl rand -hex 32}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Администратор}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Порт наружу не публикуем: API идёт через nginx вместе с панелью.

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api
