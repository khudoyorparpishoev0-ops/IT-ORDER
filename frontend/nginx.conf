server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Панель и API живут на одном origin — CORS не нужен.
    #
    # Помощник думает десятки секунд, а nginx по умолчанию ждёт ответ
    # минуту и отдаёт 504 — со стороны это выглядит как «помощник
    # недоступен». Блок объявлен раньше общего /api/: nginx выбирает
    # самый длинный совпавший префикс, но порядок оставляем читаемым.
    location /api/assistant/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Хэшированные ассеты неизменяемы, index.html — никогда не кэшируем.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Service worker и манифест обновляются вместе с панелью: закэшированный
    # старый воркер продолжал бы обслуживать старую версию.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # Иконки приложения: имя файла меняется вместе с логотипом, а
    # no-cache заставляет Safari перепроверять их — иначе ярлык на
    # телефоне месяцами показывал бы старый знак.
    location /icons/ {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }

    # SPA: любой маршрут отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
